name: Build Android APK & Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. ANDROID APK BUILD (Capacitor + Gradle)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Copy Web Dist to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Android APK with Gradle
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Locate and Package Android APK
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Successfully generated APK: $APK_FILE"
            cp "$APK_FILE" release-artifacts/CueMasters-8BallPool.apk
          else
            echo "ERROR: Failed to generate Android APK."
            exit 1
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: CueMasters-8BallPool-Android-APK
          path: release-artifacts/CueMasters-8BallPool.apk
          retention-days: 30
          if-no-files-found: error

  # ==========================================
  # 2. WINDOWS STANDALONE EXECUTABLE BUILD
  # ==========================================
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node Dependencies
        shell: pwsh
        run: |
          # Resolve npm issue #4828: lockfile created on Linux omits Windows native optional dependencies
          if (Test-Path "package-lock.json") { Remove-Item "package-lock.json" -Force }
          npm install --legacy-peer-deps
          npm install --no-save @rolldown/binding-win32-x64-msvc --legacy-peer-deps || Write-Host "Binding check complete"

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Portable Runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-windows\CueMasters-Windows-v1.0"
          Copy-Item -Recurse -Force "dist\*" "release-windows\CueMasters-Windows-v1.0\"
          
          # Create instant Windows Launcher Batch file
          $LauncherScript = @"
          @echo off
          title Cue Masters: 8 Ball Pool
          echo Starting Cue Masters...
          start "" "%~dp0index.html"
          exit
          "@
          Set-Content -Path "release-windows\CueMasters-Windows-v1.0\Launch-Game.bat" -Value $LauncherScript

          # Create PowerShell Native Applet Window runner (Full-screen kiosk mode)
          $KioskScript = @"
          Add-Type -AssemblyName System.Windows.Forms
          `$url = (Resolve-Path ".\index.html").Path
          Start-Process "msedge.exe" -ArgumentList "--app=`$url --start-fullscreen --kiosk"
          "@
          Set-Content -Path "release-windows\CueMasters-Windows-v1.0\Play-Fullscreen.ps1" -Value $KioskScript

          Compress-Archive -Path "release-windows\CueMasters-Windows-v1.0\*" -DestinationPath "release-windows\CueMasters-Windows-v1.0.zip" -Force

      - name: Upload Windows Standalone Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueMasters-Windows-Executable
          path: release-windows/CueMasters-Windows-v1.0.zip
          retention-days: 30
